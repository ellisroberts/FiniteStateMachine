name: Unit tests

on:
  push:
  pull_request:

jobs:
  linux:
    name: ${{ matrix.generator }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        generator:
          - Ninja
          - Unix Makefiles
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcppunit-dev ninja-build pkg-config
      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  mingw:
    name: ${{ matrix.generator }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        generator:
          - MinGW Makefiles
          - Ninja
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-cppunit
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
